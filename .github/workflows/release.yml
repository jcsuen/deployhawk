name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./scripts/make-app-bundle.sh

      - name: Zip
        run: ditto -c -k --keepParent dist/DeployHawk.app dist/DeployHawk.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/DeployHawk.zip \
            --title "DeployHawk ${GITHUB_REF_NAME#v}" \
            --generate-notes
